<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TaskPilot</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="TaskPilot – a fast, keyboard-friendly task manager." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // Apply the persisted theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('taskpilot:v1') || 'null');
          var t = (s && s.settings && s.settings.theme) || 'system';
          if (t === 'system')
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
