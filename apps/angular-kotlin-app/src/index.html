<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TaskPilot</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="TaskPilot – a fast, local-first task manager." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // Apply the persisted theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var raw = localStorage.getItem('taskpilot:v2') || localStorage.getItem('taskpilot:v1');
          var data = raw ? JSON.parse(raw) : null;
          var theme = (data && data.settings && data.settings.theme) || 'system';
          if (theme === 'system') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
